# Each morning (and Sunday before the early games) list today's DraftKings slates in dfs_todo.json on the "data" branch.
# Rich's phone (Tasker) then fetches each slate's salaries and sends them to the relay, which starts "DFS lineups" on that branch.
name: DFS slate list
on:
  schedule:
    - cron: '47 13 * * *'     # 7:47 am Central (6:47 during daylight time)
    - cron: '5 16 * * 0'      # Sunday 10:05 am Central, after inactives
  workflow_dispatch:
permissions:
  contents: write
concurrency: dfs-todo
jobs:
  todo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: package}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python3 dfs/make_todo.py /tmp/dfs_todo.json
      - name: Save to the data branch
        run: |
          git config user.name "dfs-bot"; git config user.email "dfs-bot@users.noreply.github.com"
          git fetch origin data && git checkout -B data origin/data
          cp /tmp/dfs_todo.json dfs_todo.json && git add dfs_todo.json
          git commit -m "Slate list $(date -u +%F' '%H:%M)" || echo "no change"
          git push origin data
